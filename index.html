<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="game.css">
    <title>Rock Paper Scissor GAME</title>
</head>

<style>
    body {
        margin: 0 auto;
        align-items: center;
    }
</style>

<body>
    <button class="rock" id="rockBtn" onclick="
    const randomNumber =  Math.random();

    let computerMove = '';

    if (randomNumber >= 0 && randomNumber < 1/3) {
        computerMove = 'Rock';
    }

    else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        computerMove = 'Paper';
    }
    
    else if (randomNumber >= 2/3 && randomNumber < 1) {
        computerMove = 'Scissor';
    }

    let result = '';

    if (computerMove === 'Rock') {
        result ='Tie';
    } else if (computerMove === 'Paper') {
        result ='You Loss 😭';
    } else if (computerMove === 'Scissor') {
        result ='You Win 🎉';
    }

    alert(`You picked ---> Rock |  | Computer picked ---> ${computerMove} | Result ---> ${result}`);

    if (result === 'You Win 🎉') {
        winStats = winStats + 1;
    } else if (result === 'You Loss 😭') {
        lossStats = lossStats + 1;
    } else if (result === 'Tie') {
        tieStats = tieStats + 1;
    }

    document.getElementById('winStats').textContent = winStats;
    document.getElementById('lossStats').textContent = lossStats;
    document.getElementById('tieStats').textContent = tieStats;

    ">
